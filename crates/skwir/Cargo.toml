    { source = "../../tools/package/notices/skwir-poppler/THIRD-PARTY-NOTICES", dest = "/usr/share/licenses/skwir-poppler/THIRD-PARTY-NOTICES", mode = "644" },
    { source = "../../tools/package/licenses/GPL-3.0", dest = "/usr/share/licenses/skwir-poppler/GPL-3.0", mode = "644" },
