[package]
name = "skwir-alloc"
description = "skwir: the process-wide allocator of the skwir binaries (ADR-011)"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# mimalloc, tuned (ADR-011). Without it the binaries use the system
# allocator, which heap profilers such as heaptrack can see.
mimalloc = ["dep:mimalloc", "dep:libmimalloc-sys"]

[dependencies]
mimalloc = { workspace = true, optional = true }
libmimalloc-sys = { workspace = true, optional = true }

[lints]
workspace = true
