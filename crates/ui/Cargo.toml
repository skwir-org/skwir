[package]
name = "bibli-ui"
description = "bibli UI shell on GPUI (ADR-001)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bibli-core.workspace = true
gpui.workspace = true
flume.workspace = true
nucleo-matcher.workspace = true
anyhow.workspace = true
tempfile.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
unicode-segmentation.workspace = true
jiff.workspace = true
schemars.workspace = true
toml.workspace = true
bibli-platform.workspace = true
image = { workspace = true, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
syntect.workspace = true
two-face.workspace = true
smallvec = "1"

[features]
# Dev-only PNG/JPEG decoder registered as a thumbnail provider, for testing
# the views before the platform providers exist. Off by default.
dev-thumbs = []

[lints]
workspace = true
