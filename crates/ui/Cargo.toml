[package]
name = "skwir-ui"
description = "skwir UI shell on GPUI (ADR-001)"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
# Where About's Website and Source code (its /source) lead: the project's
# own domain, whoever hosts the code.
homepage.workspace = true
rust-version.workspace = true

[dependencies]
# The index of a text read where it is shown (`text_view`), shared with
# the workers that count and read it.
parking_lot.workspace = true
skwir-core.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
flume.workspace = true
nucleo-matcher.workspace = true
anyhow.workspace = true
tempfile.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
unicode-segmentation.workspace = true
jiff.workspace = true
schemars.workspace = true
toml.workspace = true
skwir-platform.workspace = true
image = { workspace = true, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
smallvec = "1"

# The window's handle, for its taskbar button's progress (ADR-114): the
# version gpui implements it in.
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"

# A signal to end (a log out, a shutdown) stops what runs as Stop and quit
# does (ADR-115): the version already in the tree.
[target.'cfg(unix)'.dependencies]
signal-hook = "0.4"

[dev-dependencies]
# A test's stand-in location sends its listing as core's do.
crossbeam-channel.workspace = true

[features]
# Dev-only PNG/JPEG decoder registered as a thumbnail provider, for testing
# the views before the platform providers exist. Off by default.
dev-thumbs = []

[lints]
workspace = true
