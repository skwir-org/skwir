[package]
name = "skwir-model-worker"
description = "skwir helper: 3D meshes read and drawn as a picture, in a process of its own"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde_json.workspace = true
png.workspace = true
# STL, ASCII or binary; no dependencies of its own.
stl_io = "0.11"
# OBJ, without the materials (they would name other files).
tobj = { version = "4", default-features = false }
# glTF and GLB, read with the accessors' helpers; buffers are loaded here.
gltf = { version = "1.4", default-features = false, features = ["utils"] }
base64 = "0.22"
# 3MF packages: the zip and XML readers already in the tree.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "0.42"
# Rhino models' compressed buffers; the zip reader's zlib already.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
# STEP: read and meshed by ogeom, pure Rust (ADR-069).
ogeom-algo = "0.11.5"
ogeom-core = "0.11.5"
ogeom-doc = "0.11.5"
ogeom-io = "0.11.5"
ogeom-math = "0.11.5"
ogeom-mesh = "0.11.5"
ogeom-topo = "0.11.5"

[dev-dependencies]
tempfile.workspace = true
# Test files built as the helper reads them.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints]
workspace = true
