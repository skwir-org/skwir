[package]
name = "bibli"
description = "bibli: the file manager binary, wiring core, plugins, and the UI shell"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "bibli"
path = "src/main.rs"

[features]
default = ["mimalloc"]
# The tuned mimalloc of ADR-011; build without it to profile with heaptrack.
mimalloc = ["bibli-alloc/mimalloc"]

[dependencies]
bibli-alloc.workspace = true
bibli-core.workspace = true
bibli-plugin-places.workspace = true
bibli-plugin-open-with.workspace = true
bibli-plugin-ops-basic.workspace = true
bibli-plugin-thumbnails.workspace = true
bibli-plugin-timeline.workspace = true
bibli-plugin-usage.workspace = true
bibli-plugin-shell.workspace = true
bibli-plugin-tags.workspace = true
bibli-plugin-xmp.workspace = true
bibli-plugin-tagspaces.workspace = true
bibli-plugin-jump.workspace = true
bibli-plugin-edit-as-buffer.workspace = true
bibli-plugin-rename-bulk.workspace = true
bibli-plugin-shelf.workspace = true
bibli-plugin-query.workspace = true
bibli-plugin-preview-media.workspace = true
bibli-plugin-preview-hex.workspace = true
bibli-plugin-preview-markdown.workspace = true
bibli-plugin-preview-archives.workspace = true
bibli-plugin-preview-epub.workspace = true
bibli-plugin-preview-tables.workspace = true
bibli-plugin-preview-playlists.workspace = true
bibli-plugin-mpris.workspace = true
bibli-plugin-preview-structured.workspace = true
bibli-plugin-preview-fonts.workspace = true
bibli-plugin-preview-models.workspace = true
bibli-plugin-preview-circuits.workspace = true
bibli-plugin-preview-email.workspace = true
bibli-plugin-preview-comics.workspace = true
bibli-plugin-preview-documents.workspace = true
bibli-plugin-terminal.workspace = true
bibli-plugin-geo.workspace = true
bibli-plugin-map-tiles.workspace = true
bibli-plugin-vim.workspace = true
bibli-ui.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true

[dev-dependencies]
toml.workspace = true
bibli-platform.workspace = true
tempfile.workspace = true
dirs.workspace = true
serde_json.workspace = true
xattr.workspace = true

zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
