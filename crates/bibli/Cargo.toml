[package]
name = "bibli"
# What the packages say of it (ADR-040): the binary wires core, the
# plugins and the UI shell.
description = "An experimental file manager, GPU-drawn, for people, scripts and agents"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "bibli"
path = "src/main.rs"

[features]
default = ["mimalloc"]
# The tuned mimalloc of ADR-011; build without it to profile with heaptrack.
mimalloc = ["bibli-alloc/mimalloc"]

[dependencies]
bibli-alloc.workspace = true
bibli-core.workspace = true
bibli-platform.workspace = true
bibli-plugin-places.workspace = true
bibli-plugin-open-with.workspace = true
bibli-plugin-ops-basic.workspace = true
bibli-plugin-thumbnails.workspace = true
bibli-plugin-timeline.workspace = true
bibli-plugin-usage.workspace = true
bibli-plugin-shell.workspace = true
bibli-plugin-tags.workspace = true
bibli-plugin-xmp.workspace = true
bibli-plugin-tagspaces.workspace = true
bibli-plugin-name-tags.workspace = true
bibli-plugin-jump.workspace = true
bibli-plugin-edit-as-buffer.workspace = true
bibli-plugin-rename-bulk.workspace = true
bibli-plugin-shelf.workspace = true
bibli-plugin-trash.workspace = true
bibli-plugin-query.workspace = true
bibli-plugin-preview-media.workspace = true
bibli-plugin-preview-hex.workspace = true
bibli-plugin-preview-markdown.workspace = true
bibli-plugin-preview-archives.workspace = true
bibli-plugin-preview-epub.workspace = true
bibli-plugin-preview-tables.workspace = true
bibli-plugin-preview-playlists.workspace = true
bibli-plugin-mpris.workspace = true
bibli-plugin-control.workspace = true
bibli-extend.workspace = true
bibli-plugin-preview-structured.workspace = true
bibli-plugin-preview-fonts.workspace = true
bibli-plugin-preview-models.workspace = true
bibli-plugin-preview-circuits.workspace = true
bibli-plugin-preview-email.workspace = true
bibli-plugin-preview-comics.workspace = true
bibli-plugin-preview-documents.workspace = true
bibli-plugin-terminal.workspace = true
bibli-plugin-geo.workspace = true
bibli-plugin-map-tiles.workspace = true
bibli-plugin-vim.workspace = true
bibli-ui.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[dev-dependencies]
toml.workspace = true
bibli-core = { workspace = true, features = ["testing"] }
proptest.workspace = true
tempfile.workspace = true
dirs.workspace = true
serde_json.workspace = true

zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }

# The Linux packages (ADR-040, ADR-041): bibli in /usr/bin, its helpers
# where a distribution keeps a program's own (`process::helper_folders`),
# PDFium beside its helper, the desktop entry and the metainfo. Built on
# the distribution each is for, whose libraries they depend on:
# tools/package/deb.sh, rpm.sh, and the AUR's tools/package/aur/PKGBUILD,
# which lists the same files. A helper whose libraries most systems do
# not need (GStreamer, Poppler), or that few want (Mermaid, MuPDF), is a
# package of its own, recommended or suggested: the tools find what each
# program links, so no list of library packages is kept by hand.

# Debian and Ubuntu (cargo-deb). Beside what the programs link ($auto),
# what bibli opens at run time: the Vulkan loader and fontconfig.
[package.metadata.deb]
maintainer = "The bibli authors"
copyright = "The bibli authors"
profile = "dist"
section = "utils"
priority = "optional"
extended-description = """\
An experimental file manager, drawn by the GPU, built to be driven by \
people, scripts and agents alike: lists, grids and columns that stay \
responsive on very large folders, previews of documents, pictures, \
music, films, archives and maps, tags kept on the files themselves, \
and every change undoable."""
depends = "$auto, libvulkan1, libfontconfig1"
recommends = "bibli-media, mesa-vulkan-drivers, bubblewrap, udisks2"
suggests = "bibli-poppler, bibli-mermaid, bibli-mupdf, poppler-utils, libreoffice-writer, libreoffice-calc, libreoffice-impress, pandoc, imagemagick, ffmpeg, libimage-exiftool-perl, plocate"
assets = [
    ["target/release/bibli", "usr/bin/", "755"],
    ["target/release/bibli-pdf-worker", "usr/lib/bibli/", "755"],
    ["target/release/bibli-archive-worker", "usr/lib/bibli/", "755"],
    ["target/release/bibli-model-worker", "usr/lib/bibli/", "755"],
    ["target/release/bibli-module-worker", "usr/lib/bibli/", "755"],
    ["../../target/pdfium/libpdfium.so", "usr/lib/bibli/", "644"],
    ["../../target/pdfium/licenses/pdfium/*", "usr/share/doc/bibli/pdfium/", "644"],
    ["../../tools/package/linux/bibli.desktop", "usr/share/applications/", "644"],
    ["../../tools/package/linux/io.github.venator.bibli.metainfo.xml", "usr/share/metainfo/", "644"],
    ["../../tools/package/linux/copyright", "usr/share/doc/bibli/copyright", "644"],
    ["../../target/notices/bibli/THIRD-PARTY-NOTICES", "usr/share/doc/bibli/", "644"],
    ["../../README.md", "usr/share/doc/bibli/", "644"],
]

[package.metadata.deb.variants.media]
name = "bibli-media"
extended-description = "bibli's audio and video player, through GStreamer."
depends = "$auto, bibli"
recommends = "gstreamer1.0-plugins-base, gstreamer1.0-plugins-good"
suggests = "gstreamer1.0-plugins-bad, gstreamer1.0-plugins-ugly, gstreamer1.0-libav"
assets = [
    ["target/release/bibli-media-worker", "usr/lib/bibli/", "755"],
    ["../../target/notices/bibli-media/THIRD-PARTY-NOTICES", "usr/share/doc/bibli-media/", "644"],
]

[package.metadata.deb.variants.poppler]
name = "bibli-poppler"
extended-description = "bibli's PDF reader through Poppler, beside the PDFium one bibli carries."
depends = "$auto, bibli"
recommends = ""
suggests = ""
assets = [
    ["target/release/bibli-poppler-worker", "usr/lib/bibli/", "755"],
    ["../../tools/package/linux/copyright-poppler", "usr/share/doc/bibli-poppler/copyright", "644"],
    ["../../target/notices/bibli-poppler/THIRD-PARTY-NOTICES", "usr/share/doc/bibli-poppler/", "644"],
]

[package.metadata.deb.variants.mermaid]
name = "bibli-mermaid"
extended-description = "Mermaid diagrams drawn in bibli's Markdown previews."
depends = "$auto, bibli"
recommends = ""
suggests = ""
assets = [
    ["target/release/bibli-mermaid-worker", "usr/lib/bibli/", "755"],
    ["../../target/notices/bibli-mermaid/THIRD-PARTY-NOTICES", "usr/share/doc/bibli-mermaid/", "644"],
]

[package.metadata.deb.variants.mupdf]
name = "bibli-mupdf"
extended-description = "bibli's MuPDF engine: PDFs, and books laid out into pages."
depends = "$auto, bibli"
recommends = ""
suggests = ""
assets = [
    ["target/release/bibli-mupdf-worker", "usr/lib/bibli/", "755"],
    ["../../tools/package/linux/copyright-mupdf", "usr/share/doc/bibli-mupdf/copyright", "644"],
    ["../../target/notices/bibli-mupdf/THIRD-PARTY-NOTICES", "usr/share/doc/bibli-mupdf/", "644"],
]

# Fedora, openSUSE and the others that install RPMs (cargo-generate-rpm):
# helpers, and PDFium beside its own, in /usr/libexec/bibli. Beside what
# the programs link (auto-req), what bibli opens at run time: the Vulkan
# loader and fontconfig.
[package.metadata.generate-rpm]
# bibli's own, and PDFium's (its parts' notices in
# /usr/share/licenses/bibli/pdfium). The licences are plain files, not
# documents, so a system installed without documents (`tsflags=nodocs`,
# as container images are) keeps them: cargo-generate-rpm cannot mark a
# file %license. Fedora keeps no common licence texts, so each package
# holds its own: bibli's, and the GPL's or the AGPL's for the readers
# that link Poppler or MuPDF (the FSF's texts, tools/package/licenses).
license = "Apache-2.0 AND BSD-3-Clause"
url = "https://github.com/venator/bibli"
auto-req = "auto"
assets = [
    { source = "target/release/bibli", dest = "/usr/bin/bibli", mode = "755" },
    { source = "target/release/bibli-pdf-worker", dest = "/usr/libexec/bibli/bibli-pdf-worker", mode = "755" },
    { source = "target/release/bibli-archive-worker", dest = "/usr/libexec/bibli/bibli-archive-worker", mode = "755" },
    { source = "target/release/bibli-model-worker", dest = "/usr/libexec/bibli/bibli-model-worker", mode = "755" },
    { source = "target/release/bibli-module-worker", dest = "/usr/libexec/bibli/bibli-module-worker", mode = "755" },
    { source = "../../target/pdfium/libpdfium.so", dest = "/usr/libexec/bibli/libpdfium.so", mode = "755" },
    { source = "../../target/pdfium/licenses/pdfium/*", dest = "/usr/share/licenses/bibli/pdfium/", mode = "644" },
    { source = "../../tools/package/linux/bibli.desktop", dest = "/usr/share/applications/bibli.desktop", mode = "644" },
    { source = "../../tools/package/linux/io.github.venator.bibli.metainfo.xml", dest = "/usr/share/metainfo/io.github.venator.bibli.metainfo.xml", mode = "644" },
    { source = "../../LICENSE", dest = "/usr/share/licenses/bibli/LICENSE", mode = "644" },
    { source = "../../target/notices/bibli/THIRD-PARTY-NOTICES", dest = "/usr/share/licenses/bibli/THIRD-PARTY-NOTICES", mode = "644" },
    { source = "../../README.md", dest = "/usr/share/doc/bibli/README.md", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
vulkan-loader = "*"
fontconfig = "*"

[package.metadata.generate-rpm.recommends]
bibli-media = "*"
mesa-vulkan-drivers = "*"
bubblewrap = "*"
udisks2 = "*"

[package.metadata.generate-rpm.suggests]
bibli-poppler = "*"
bibli-mermaid = "*"
bibli-mupdf = "*"
poppler-utils = "*"
libreoffice-writer = "*"
libreoffice-calc = "*"
libreoffice-impress = "*"
pandoc = "*"
ImageMagick = "*"
ffmpeg-free = "*"
perl-Image-ExifTool = "*"
plocate = "*"

[package.metadata.generate-rpm.variants.media]
name = "bibli-media"
license = "Apache-2.0"
summary = "bibli's audio and video player, through GStreamer"
assets = [
    { source = "target/release/bibli-media-worker", dest = "/usr/libexec/bibli/bibli-media-worker", mode = "755" },
    { source = "../../LICENSE", dest = "/usr/share/licenses/bibli-media/LICENSE", mode = "644" },
    { source = "../../target/notices/bibli-media/THIRD-PARTY-NOTICES", dest = "/usr/share/licenses/bibli-media/THIRD-PARTY-NOTICES", mode = "644" },
]
requires = { bibli = "*" }
recommends = { gstreamer1-plugins-base = "*", gstreamer1-plugins-good = "*" }
suggests = { gstreamer1-plugins-bad-free = "*", gstreamer1-plugins-ugly-free = "*", gstreamer1-plugin-libav = "*" }

[package.metadata.generate-rpm.variants.poppler]
name = "bibli-poppler"
summary = "bibli's PDF reader through Poppler"
license = "GPL-3.0-only"
assets = [
    { source = "target/release/bibli-poppler-worker", dest = "/usr/libexec/bibli/bibli-poppler-worker", mode = "755" },
    { source = "../../LICENSE", dest = "/usr/share/licenses/bibli-poppler/LICENSE", mode = "644" },
    { source = "../../target/notices/bibli-poppler/THIRD-PARTY-NOTICES", dest = "/usr/share/licenses/bibli-poppler/THIRD-PARTY-NOTICES", mode = "644" },
    { source = "../../tools/package/licenses/GPL-3.0", dest = "/usr/share/licenses/bibli-poppler/GPL-3.0", mode = "644" },
]
requires = { bibli = "*" }
recommends = {}
suggests = {}

[package.metadata.generate-rpm.variants.mermaid]
name = "bibli-mermaid"
license = "Apache-2.0"
summary = "Mermaid diagrams drawn in bibli's Markdown previews"
assets = [
    { source = "target/release/bibli-mermaid-worker", dest = "/usr/libexec/bibli/bibli-mermaid-worker", mode = "755" },
    { source = "../../LICENSE", dest = "/usr/share/licenses/bibli-mermaid/LICENSE", mode = "644" },
    { source = "../../target/notices/bibli-mermaid/THIRD-PARTY-NOTICES", dest = "/usr/share/licenses/bibli-mermaid/THIRD-PARTY-NOTICES", mode = "644" },
]
requires = { bibli = "*" }
recommends = {}
suggests = {}

[package.metadata.generate-rpm.variants.mupdf]
name = "bibli-mupdf"
summary = "bibli's MuPDF engine: PDFs, and books laid out into pages"
license = "AGPL-3.0-or-later"
assets = [
    { source = "target/release/bibli-mupdf-worker", dest = "/usr/libexec/bibli/bibli-mupdf-worker", mode = "755" },
    { source = "../../LICENSE", dest = "/usr/share/licenses/bibli-mupdf/LICENSE", mode = "644" },
    { source = "../../target/notices/bibli-mupdf/THIRD-PARTY-NOTICES", dest = "/usr/share/licenses/bibli-mupdf/THIRD-PARTY-NOTICES", mode = "644" },
    { source = "../../tools/package/licenses/AGPL-3.0", dest = "/usr/share/licenses/bibli-mupdf/AGPL-3.0", mode = "644" },
]
requires = { bibli = "*" }
recommends = {}
suggests = {}
