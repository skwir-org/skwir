[package]
name = "bibli"
# What the packages say of it (ADR-040): the binary wires core, the
# plugins and the UI shell.
description = "An experimental file manager, GPU-drawn, for people, scripts and agents"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "bibli"
path = "src/main.rs"

[features]
default = ["mimalloc"]
# The tuned mimalloc of ADR-011; build without it to profile with heaptrack.
mimalloc = ["bibli-alloc/mimalloc"]

[dependencies]
bibli-alloc.workspace = true
bibli-core.workspace = true
bibli-plugin-places.workspace = true
bibli-plugin-open-with.workspace = true
bibli-plugin-ops-basic.workspace = true
bibli-plugin-thumbnails.workspace = true
bibli-plugin-timeline.workspace = true
bibli-plugin-usage.workspace = true
bibli-plugin-shell.workspace = true
bibli-plugin-tags.workspace = true
bibli-plugin-xmp.workspace = true
bibli-plugin-tagspaces.workspace = true
bibli-plugin-name-tags.workspace = true
bibli-plugin-jump.workspace = true
bibli-plugin-edit-as-buffer.workspace = true
bibli-plugin-rename-bulk.workspace = true
bibli-plugin-shelf.workspace = true
bibli-plugin-trash.workspace = true
bibli-plugin-query.workspace = true
bibli-plugin-preview-media.workspace = true
bibli-plugin-preview-hex.workspace = true
bibli-plugin-preview-markdown.workspace = true
bibli-plugin-preview-archives.workspace = true
bibli-plugin-preview-epub.workspace = true
bibli-plugin-preview-tables.workspace = true
bibli-plugin-preview-playlists.workspace = true
bibli-plugin-mpris.workspace = true
bibli-plugin-preview-structured.workspace = true
bibli-plugin-preview-fonts.workspace = true
bibli-plugin-preview-models.workspace = true
bibli-plugin-preview-circuits.workspace = true
bibli-plugin-preview-email.workspace = true
bibli-plugin-preview-comics.workspace = true
bibli-plugin-preview-documents.workspace = true
bibli-plugin-terminal.workspace = true
bibli-plugin-geo.workspace = true
bibli-plugin-map-tiles.workspace = true
bibli-plugin-vim.workspace = true
bibli-ui.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true

[dev-dependencies]
toml.workspace = true
bibli-platform.workspace = true
tempfile.workspace = true
dirs.workspace = true
serde_json.workspace = true

zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }

# The Linux packages (ADR-040): bibli in /usr/bin, its helpers where a
# distribution keeps a program's own (`process::helper_folders`), the
# desktop entry and the metainfo. Built on the distribution each is for,
# whose libraries they depend on: tools/package/deb.sh, rpm.sh, and the
# AUR's tools/package/aur/PKGBUILD, which lists the same files.

# Debian and Ubuntu (cargo-deb). Beside what the programs link ($auto),
# what bibli opens at run time: the Vulkan loader and fontconfig.
[package.metadata.deb]
maintainer = "The bibli authors"
copyright = "The bibli authors"
profile = "dist"
section = "utils"
priority = "optional"
extended-description = """\
An experimental file manager, drawn by the GPU, built to be driven by \
people, scripts and agents alike: lists, grids and columns that stay \
responsive on very large folders, previews of documents, pictures, \
music, films, archives and maps, tags kept on the files themselves, \
and every change undoable."""
depends = "$auto, libvulkan1, libfontconfig1"
recommends = "mesa-vulkan-drivers, bubblewrap, gstreamer1.0-plugins-base, gstreamer1.0-plugins-good, poppler-utils, udisks2"
suggests = "libreoffice-writer, libreoffice-calc, libreoffice-impress, pandoc, imagemagick, ffmpeg, libimage-exiftool-perl, plocate, gstreamer1.0-plugins-bad, gstreamer1.0-plugins-ugly, gstreamer1.0-libav"
assets = [
    ["target/release/bibli", "usr/bin/", "755"],
    ["target/release/bibli-pdf-worker", "usr/lib/bibli/", "755"],
    ["target/release/bibli-poppler-worker", "usr/lib/bibli/", "755"],
    ["target/release/bibli-mupdf-worker", "usr/lib/bibli/", "755"],
    ["target/release/bibli-media-worker", "usr/lib/bibli/", "755"],
    ["target/release/bibli-archive-worker", "usr/lib/bibli/", "755"],
    ["target/release/bibli-mermaid-worker", "usr/lib/bibli/", "755"],
    ["target/release/bibli-model-worker", "usr/lib/bibli/", "755"],
    ["../../tools/package/linux/bibli.desktop", "usr/share/applications/", "644"],
    ["../../tools/package/linux/io.github.venator.bibli.metainfo.xml", "usr/share/metainfo/", "644"],
    ["../../tools/package/linux/copyright", "usr/share/doc/bibli/copyright", "644"],
    ["../../README.md", "usr/share/doc/bibli/", "644"],
]

# Fedora, openSUSE and the others that install RPMs (cargo-generate-rpm):
# helpers in /usr/libexec. Beside what the programs link (auto-req), what
# bibli opens at run time: the Vulkan loader and fontconfig.
[package.metadata.generate-rpm]
license = "(MIT OR Apache-2.0) AND GPL-2.0-or-later AND AGPL-3.0-or-later"
url = "https://github.com/venator/bibli"
auto-req = "auto"
assets = [
    { source = "target/release/bibli", dest = "/usr/bin/bibli", mode = "755" },
    { source = "target/release/bibli-pdf-worker", dest = "/usr/libexec/bibli/bibli-pdf-worker", mode = "755" },
    { source = "target/release/bibli-poppler-worker", dest = "/usr/libexec/bibli/bibli-poppler-worker", mode = "755" },
    { source = "target/release/bibli-mupdf-worker", dest = "/usr/libexec/bibli/bibli-mupdf-worker", mode = "755" },
    { source = "target/release/bibli-media-worker", dest = "/usr/libexec/bibli/bibli-media-worker", mode = "755" },
    { source = "target/release/bibli-archive-worker", dest = "/usr/libexec/bibli/bibli-archive-worker", mode = "755" },
    { source = "target/release/bibli-mermaid-worker", dest = "/usr/libexec/bibli/bibli-mermaid-worker", mode = "755" },
    { source = "target/release/bibli-model-worker", dest = "/usr/libexec/bibli/bibli-model-worker", mode = "755" },
    { source = "../../tools/package/linux/bibli.desktop", dest = "/usr/share/applications/bibli.desktop", mode = "644" },
    { source = "../../tools/package/linux/io.github.venator.bibli.metainfo.xml", dest = "/usr/share/metainfo/io.github.venator.bibli.metainfo.xml", mode = "644" },
    { source = "../../LICENSE-MIT", dest = "/usr/share/licenses/bibli/LICENSE-MIT", mode = "644", doc = true },
    { source = "../../LICENSE-APACHE", dest = "/usr/share/licenses/bibli/LICENSE-APACHE", mode = "644", doc = true },
    { source = "../../README.md", dest = "/usr/share/doc/bibli/README.md", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
vulkan-loader = "*"
fontconfig = "*"

[package.metadata.generate-rpm.recommends]
mesa-vulkan-drivers = "*"
bubblewrap = "*"
gstreamer1-plugins-base = "*"
gstreamer1-plugins-good = "*"
poppler-utils = "*"
udisks2 = "*"

[package.metadata.generate-rpm.suggests]
libreoffice-writer = "*"
libreoffice-calc = "*"
libreoffice-impress = "*"
pandoc = "*"
ImageMagick = "*"
ffmpeg-free = "*"
perl-Image-ExifTool = "*"
plocate = "*"
gstreamer1-plugins-bad-free = "*"
gstreamer1-plugins-ugly-free = "*"
gstreamer1-plugin-libav = "*"
