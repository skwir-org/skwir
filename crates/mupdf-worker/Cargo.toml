[package]
name = "bibli-mupdf-worker"
description = "On-demand MuPDF document worker for bibli"
version.workspace = true
edition.workspace = true
# Our source is MIT OR Apache-2.0 like the rest of bibli. The worker binary
# links MuPDF, which is AGPL-3.0: whoever distributes this executable
# distributes it under the AGPL (ADR-014). No other crate depends on it.
license.workspace = true
rust-version.workspace = true

[dependencies]
bibli-core.workspace = true
anyhow.workspace = true
serde_json.workspace = true
# MuPDF 1.27.2, built from the source the crate bundles with its own
# third-party libraries (MuPDF relies on its own lcms2 fork). Only the 14
# standard PDF fonts are compiled in; scripting and OCR are left out.
mupdf = { version = "=0.8.0", default-features = false, features = ["base14-fonts"] }

[lints]
workspace = true
