[package]
name = "skwir-mupdf-worker"
description = "On-demand MuPDF document worker for skwir"
version.workspace = true
publish.workspace = true
edition.workspace = true
# Our source is Apache-2.0 like the rest of skwir. The worker binary
# links MuPDF, which is AGPL-3.0: whoever distributes this executable
# distributes it under the AGPL (ADR-014). No other crate depends on it.
license.workspace = true
rust-version.workspace = true

[dependencies]
skwir-core.workspace = true
anyhow.workspace = true
# MuPDF 1.27.2, built from the source the crate bundles with its own
# third-party libraries (MuPDF relies on its own lcms2 fork). The 14
# standard PDF fonts are compiled in; text they do not cover (a book in
# Cyrillic or Chinese without fonts of its own) falls back to the system's.
# EPUB and HTML are read for books laid out into pages; scripting and OCR
# are left out.
mupdf = { version = "=0.8.0", default-features = false, features = ["base14-fonts", "epub", "html"] }
# The script and language codes MuPDF asks for fallback fonts with.
mupdf-sys = { version = "=0.8.0", default-features = false }

[lints]
workspace = true
