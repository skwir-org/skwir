[package]
name = "skwir-bench"
description = "skwir: synthetic-tree generator and performance regression checks"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "skwir-bench"
path = "src/main.rs"

[features]
default = ["mimalloc"]
# The tuned mimalloc of ADR-011; build without it to profile with heaptrack.
mimalloc = ["skwir-alloc/mimalloc"]

[dependencies]
skwir-alloc.workspace = true
skwir-core.workspace = true
skwir-platform.workspace = true
skwir-plugin-query.workspace = true
skwir-plugin-tags.workspace = true
skwir-plugin-xmp.workspace = true
skwir-plugin-tagspaces.workspace = true
skwir-plugin-name-tags.workspace = true
skwir-plugin-usage.workspace = true
tempfile.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
rustix.workspace = true
rayon.workspace = true
image.workspace = true
ignore.workspace = true
memchr.workspace = true
regex-syntax.workspace = true

[lints]
workspace = true
