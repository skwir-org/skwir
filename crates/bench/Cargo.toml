[package]
name = "bibli-bench"
description = "bibli: synthetic-tree generator and performance regression checks"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "bibli-bench"
path = "src/main.rs"

[features]
default = ["mimalloc"]
# The tuned mimalloc of ADR-011; build without it to profile with heaptrack.
mimalloc = ["bibli-alloc/mimalloc"]

[dependencies]
bibli-alloc.workspace = true
bibli-core.workspace = true
bibli-platform.workspace = true
bibli-plugin-query.workspace = true
bibli-plugin-tags.workspace = true
bibli-plugin-xmp.workspace = true
bibli-plugin-tagspaces.workspace = true
bibli-plugin-name-tags.workspace = true
tempfile.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
rustix.workspace = true
rayon.workspace = true
image.workspace = true

[lints]
workspace = true
