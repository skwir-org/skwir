# Performance budgets for `bibli-bench check`, in microseconds, compared
# against the minimum over runs. Values are ~3x the reference machine
# (Intel i7 ADL, btrfs zstd, NVMe, warm cache) to absorb CI runner noise.
# Tighten them when the reference measurement improves; never loosen without an ADR.

[flat100k]
first_batch_us = 1_000
list_getdents_us = 90_000
list_std_us = 90_000
stat_statx_us = 300_000
stat_parallel_us = 40_000
walk_parallel_us = 90_000
stream_open_us = 1_000
stream_first_batch_us = 3_000
stream_complete_us = 100_000
# The tags plugin's provider over 100,000 files without attributes.
tags_fill_us = 550_000
# The Usage view's scan of the folder, forced (Refresh; 147 ms, warm).
usage_scan_us = 450_000
# A listing of 100,000 entries sorted by size, hydrated in 98 batches with
# the order read after each (0.46 s; a full sort after each took ~3 s),
# then one size changed (1 ms; a full sort is ~30 ms). In memory.
listing_sort_hydrate_us = 1_500_000
listing_sort_update_us = 4_000

[deep1m]
first_batch_us = 500
list_getdents_us = 300
list_std_us = 300
stat_statx_us = 600
stat_parallel_us = 1_000
walk_parallel_us = 200_000
stream_open_us = 1_000
stream_first_batch_us = 1_500
stream_complete_us = 2_000
# `tag:bench` over the whole tree, one file in a thousand tagged: bound by
# reading each file's attribute names (btrfs: ~1.6 s per million, warm).
tag_search_us = 7_500_000
# The Tags view opened again on the whole tree after a full count, nothing
# changed since: a check stats each file and reads none (`count.rs`;
# 1.29 s per million, warm).
tags_check_us = 4_000_000
# The tags index with 500 000 tagged files (`bibli_plugin_tags::index`):
# learning them (0.65 s), counting them under the home folder by folder
# (0.4 ms), and one change written: one piece of 256, and what is known
# between them (0.5 ms).
tags_index_learn_us = 2_000_000
tags_index_tally_us = 1_500
tags_index_change_us = 3_000
# The Usage view's scan of the whole tree, forced (Refresh): a stat per
# entry and a watch per folder (1.83 s per million, warm).
usage_scan_us = 5_500_000

[images10k]
first_batch_us = 1_500
list_getdents_us = 10_000
list_std_us = 12_000
stat_statx_us = 45_000
stat_parallel_us = 6_000
walk_parallel_us = 10_000
stream_open_us = 500
stream_first_batch_us = 2_500
stream_complete_us = 12_000
# Thumbnail pipeline over 200 images on 8 workers, wall-clock per image.
thumbs_cold_per_image_us = 250
thumbs_warm_per_image_us = 100
# The tags plugin's provider over 10,000 images, one in ten with tags, a
# rating and a comment.
tags_fill_us = 120_000
