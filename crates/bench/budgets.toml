# Performance budgets for `skwir-bench check`, in microseconds, compared
# against the minimum over runs. Values are ~3x the reference machine
# (Intel i7 ADL, btrfs zstd, NVMe, warm cache) to absorb CI runner noise.
# Tighten them when the reference measurement improves; never loosen without an ADR.

[flat100k]
first_batch_us = 1_000
list_getdents_us = 90_000
list_std_us = 90_000
stat_statx_us = 300_000
stat_parallel_us = 40_000
walk_parallel_us = 90_000
stream_open_us = 1_000
stream_first_batch_us = 3_000
stream_complete_us = 100_000
# The tags plugin's provider over 100,000 files without attributes.
tags_fill_us = 550_000
# The Usage view's scan of the folder, forced (Refresh; 147 ms, warm).
usage_scan_us = 450_000
# A listing of 100,000 entries sorted by size, hydrated in 98 batches with
# the order read after each (0.46 s; a full sort after each took ~3 s),
# then one size changed (1 ms; a full sort is ~30 ms). In memory.
listing_sort_hydrate_us = 1_500_000
listing_sort_update_us = 4_000
# Every name typed by name (`mime::by_name`): 0.12 s for 100,000 names
# (2.25 s before the glob index of vendored xdg-mime, patch 0003).
mime_by_name_us = 400_000
# The folder listed in a pane, all of it selected, each selected entry
# found again by its reference (`Pane::entry_at`, as `tags.toggle` finds
# them): 38 ms (100 s before the pane's index of names, core#1).
entry_at_selection_us = 120_000
# 10,000 items arriving in it placed where the pane's order will have them
# (ADR-135, `Pane::stands`): 11.2 ms, 7.0 ms once placed in their order by a
# galloping search (under a load of 9).
arriving_stands_us = 35_000
# 100,000 items arriving in it, keyed once, placed again as a pane does each
# time its order changes while they come (`Listing::stand`): 17.8 ms under a
# load of 9 (45 ms searched each from the start).
arriving_placed_again_us = 55_000
# 10,000 of 20,000 empty files in a scratch folder deleted for good by a
# plan through the executor: 0.21 s (15.2 s before the plan stopped
# looking for each deleted file in its folder, ops#1, and read the mount
# table only when it changed, ops#2).
delete_tail_us = 650_000
# The tags index holding 100,000 tagged files in one folder told the
# folder went (`TagIndex::moved`): 0.7 ms (4.6 s before tags#2).
tags_forget_us = 2_200
# An action joining a full undo history (ADR-079, 13): a 10,000-file
# action bounded as the history keeps it and compared with 200 kept
# entries of 1,000 claims each in one folder, none meeting it: 7.5 ms
# (391 ms before the names right below the shared folder were compared
# first).
history_put_us = 25_000
# The same of 200 kept entries of actions in one folder, each naming 400
# files right below it (renamed, trashed, copied there), and a new one
# naming 400 others: told apart by their names, 4.4-6.7 ms (before, the
# names the folder holds made it compare each pair's paths whole).
history_put_folder_us = 20_000
# The history as the window reads it over such a full history, with four
# actions running and twenty waiting there (`Executor::history`): sets
# read, no footprint compared, 30-53 us.
history_read_us = 400
# A copy of 100,000 files into that folder, taken whole (`Kept::exact`),
# compared with those 200 kept entries, as what joins, runs or waits is:
# its names below the folder read once, then each entry's looked up in
# them, 48-49 ms (561 ms with each entry's claims looked up in it).
history_meets_whole_us = 150_000

[deep1m]
first_batch_us = 500
list_getdents_us = 300
list_std_us = 300
stat_statx_us = 600
stat_parallel_us = 1_000
walk_parallel_us = 200_000
stream_open_us = 1_000
stream_first_batch_us = 1_500
stream_complete_us = 2_000
# `tag:bench` over the whole tree, one file in a thousand tagged: bound by
# reading each file's attribute names (btrfs: ~1.6 s per million, warm).
tag_search_us = 7_500_000
# The Tags view opened again on the whole tree after a full count, nothing
# changed since: a check stats each file and reads none (`count.rs`;
# 1.29 s per million, warm).
tags_check_us = 4_000_000
# The tags index with 500 000 tagged files (`skwir_plugin_tags::index`):
# learning them (0.65 s), counting them under the home folder by folder
# (0.4 ms), and one change written: one piece of 256, and what is known
# between them (0.5 ms).
tags_index_learn_us = 2_000_000
tags_index_tally_us = 1_500
tags_index_change_us = 3_000
# The Usage view's scan of the whole tree, forced (Refresh): a stat per
# entry and a watch per folder (1.83 s per million, warm).
usage_scan_us = 5_500_000

