[package]
name = "skwir-pdf-worker"
description = "On-demand PDFium document worker for skwir"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
skwir-core.workspace = true
anyhow.workspace = true
# Bound to an older PDFium API than the packages carry (ADR-004): every
# function of the surface named must be in the library, so a newer one
# refuses any PDFium before it, and the helper needs nothing past 6721.
pdfium-render = { version = "=0.9.5", default-features = false, features = ["pdfium_6721"] }

# Windows prints through PDFium drawing on the printer (ADR-111): its
# device-context call, and GDI's spooler calls. pdfium-render takes any
# `windows` 0.x without its features, which Cargo resolves to the newest
# the tree holds: the one the platform crate and gpui use (0.62), named
# here with the features its call needs, so its HDC is ours. When they
# move to another, this moves with them (`just check-windows` says so).
[target.'cfg(windows)'.dependencies]
pdfium-render = { version = "=0.9.5", default-features = false, features = ["pdfium_6721", "pdfium_use_win32"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_Xps"] }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
