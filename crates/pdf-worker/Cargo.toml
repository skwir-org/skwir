[package]
name = "skwir-pdf-worker"
description = "On-demand PDFium document worker for skwir"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
skwir-core.workspace = true
anyhow.workspace = true
# Bound to an older PDFium API than the packages carry (ADR-004): every
# function of the surface named must be in the library, so a newer one
# refuses any PDFium before it, and the helper needs nothing past 6721.
pdfium-render = { version = "=0.9.4", default-features = false, features = ["pdfium_6721"] }

# Windows prints through PDFium drawing on the printer (ADR-111): its
# device-context call, and GDI's spooler calls. pdfium-render takes any
# `windows` 0.x without its features; this is the one the tree resolves it
# to (0.57), the features its call needs given here, so its HDC is ours.
[target.'cfg(windows)'.dependencies]
pdfium-render = { version = "=0.9.4", default-features = false, features = ["pdfium_6721", "pdfium_use_win32"] }
windows = { version = "0.57", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_Xps"] }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
