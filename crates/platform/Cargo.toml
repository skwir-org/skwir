[package]
name = "bibli-platform"
description = "bibli platform adapters: MIME, icons, thumbnails, places, volumes, per OS"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bibli-core.workspace = true
anyhow.workspace = true
serde.workspace = true
tracing.workspace = true

open.workspace = true
dirs.workspace = true
md5.workspace = true
image = { workspace = true, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico", "qoi", "tga", "pnm", "exr", "dds"] }
png.workspace = true
parking_lot.workspace = true
tempfile.workspace = true
serde_json.workspace = true
xattr.workspace = true
jiff.workspace = true
scraper = "0.24"
# The versions scraper itself builds on: publisher stylesheets are parsed and
# matched against its tree, and XHTML read as XML is built into that tree.
cssparser = "0.35"
selectors = "0.31"
markup5ever = "0.35"
ego-tree = "0.10"
roxmltree.workspace = true
# SVG pictures in documents, and fixed-layout pages drawn as SVG with the
# book's fonts; the version and features gpui already links.
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
# Font metrics for laying out a fixed page's text; the version fontdb uses.
ttf-parser = "0.25"
# Compressed drawings (`.svgz`), inflated within a bound; the version and
# backend already in the tree.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
percent-encoding = "2"
encoding_rs = "0.8"
crossbeam-channel.workspace = true
rustix = { workspace = true, features = ["process", "event"] }
futures-lite = "2"
kamadak-exif = "0.6"

# The desktop's keyring (`secrets`): the client and features gpui already links.
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
oo7 = { version = "0.5", default-features = false, features = ["async-std", "native_crypto"] }

[target.'cfg(target_os = "linux")'.dependencies]
xdg-mime.workspace = true
freedesktop-icons.workspace = true
mime.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
