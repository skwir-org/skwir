[package]
name = "skwir-platform"
description = "skwir platform adapters: MIME, icons, thumbnails, places, volumes, per OS"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
skwir-core.workspace = true
anyhow.workspace = true
serde.workspace = true
tracing.workspace = true
# Zip packages (`package`): Word and OpenDocument files, EPUB, 3MF, KMZ,
# workbooks; the version and inflater already in the tree.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

open.workspace = true
md5.workspace = true
image = { workspace = true, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico", "qoi", "tga", "pnm", "exr", "dds"] }
# A picture's size in pixels from its header, no picture decoded (ADR-131).
imagesize = "0.15"
jpeg-decoder.workspace = true
png.workspace = true
parking_lot.workspace = true
# Tree-sitter grammars found: their descriptions and first-line patterns
# (ADR-110).
regex.workspace = true
toml.workspace = true
# Code colored with bat's grammars and themes, matched by Ferroni (ADR-060).
syntect.workspace = true
two-face.workspace = true
tempfile.workspace = true
serde_json.workspace = true
jiff.workspace = true
scraper = "0.29"
# The versions scraper itself builds on: publisher stylesheets are parsed and
# matched against its tree, and XHTML read as XML is built into that tree.
cssparser = "0.38"
selectors = "0.41"
markup5ever = "0.40"
ego-tree = "0.11"
roxmltree.workspace = true
# SVG pictures in documents, and fixed-layout pages drawn as SVG with the
# book's fonts; the version and features gpui already links.
resvg = { version = "0.46", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
# Font metrics for laying out a fixed page's text: skrifa (fontations,
# maintained), the version gpui's glyph rasterizer (swash) already brings.
skrifa = "0.44"
# Compressed drawings (`.svgz`), inflated within a bound; the version and
# backend already in the tree.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
percent-encoding = "2"
encoding_rs = "0.8"
# Where a text file's lines end, counted at memory speed (`text_rows`).
memchr.workspace = true
crossbeam-channel.workspace = true
rustix = { workspace = true, features = ["process", "event", "system"] }
futures-lite = "2"
kamadak-exif = "0.6"
# The desktop's type database (shared-mime-info): Linux's own, and the
# fallback of the system's types elsewhere (ADR-037; vendored, built on
# every system).
xdg-mime.workspace = true
mime.workspace = true

# The desktop's keyring (`secrets`): the client and features gpui already links.
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
oo7 = { version = "0.6", default-features = false, features = ["async-std", "native_crypto"] }

# Windows' own calls (ADR-035): the drives, the user's SID, the types
# the registry knows (ADR-037), the askpass's pipe, a later launch's pipe
# (ADR-115).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Globalization", "Win32_NetworkManagement_WNet", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# The shell's thumbnails (ADR-041): its COM interfaces, through the
# version of `windows` gpui already links.
# The shell's icons, from the system image list (system_icons).
# The print dialog and the memory it hands back (ADR-111).
# What the desktop is told (`desktop`): toasts, the taskbar's progress, a
# power request; the WinRT features gpui's own toasts already build. The
# notification area's icon and the session's end held off (ADR-115).
# The accent (`UISettings`, as gpui reads the look) and a contrast theme
# (`desktop_style`, ADR-071).
windows = { version = "0.62", features = ["Data_Xml_Dom", "Foundation", "UI", "UI_Notifications", "UI_ViewManagement", "Win32_UI_Accessibility", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Power", "Win32_System_Shutdown", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# macOS's own calls (ADR-035): the calendar's first weekday, the
# Keychain, the types the system knows (ADR-037). The versions already in
# the tree.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSBundle", "NSCalendar", "NSDictionary", "NSEnumerator", "NSError", "NSGeometry", "NSProcessInfo", "NSString", "NSURL", "NSValue"] }
objc2-uniform-type-identifiers = { version = "0.3", default-features = false, features = ["std", "UTCoreTypes", "UTType"] }
# The system's icons, drawn by NSImage (system_icons). The dock tile's
# badge (`desktop`).
# The system's colors, accent and contrast, as each appearance resolves
# them (`desktop_style`, ADR-071).
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSAccessibility", "NSAppearance", "NSApplication", "NSColor", "NSColorSpace", "NSDockTile", "NSGraphicsContext", "NSImage", "NSImageRep", "NSPrintInfo", "NSPrintPanel", "NSPrinter", "NSResponder", "NSWorkspace", "objc2-core-foundation", "objc2-core-graphics", "objc2-uniform-type-identifiers"] }
# Notices (`desktop`): the version gpui's own notifications link.
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger", "UNUserNotificationCenter"] }
# The print panel, shown on the main thread from a worker (ADR-111).
dispatch2 = "0.3"
# Quick Look's thumbnails, read as pixels (ADR-041).
objc2-quick-look-thumbnailing = { version = "0.3", default-features = false, features = ["std", "bitflags", "block2", "objc2-core-foundation", "objc2-core-graphics", "QLThumbnailGenerationRequest", "QLThumbnailGenerator", "QLThumbnailRepresentation"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGImage"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFCGTypes", "CFString", "CFURL"] }
block2 = "0.6"
security-framework = "3"
libc = "0.2"
# `diskutil`'s answers (ADR-088): the version the tags plugin links.
plist.workspace = true

# The settings portal's accent, contrast and font (ADR-071): the zbus the
# media controls' plugin and gpui's portal (through ashpd) already link.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
# One session connection shared, its listeners' streams merged and woken
# when stopped (`bus`): the versions zbus itself links.
futures-lite = { version = "2", default-features = false, features = ["std"] }
event-listener = "5"
# A call on the shared session bus given up on after a while (`desktop`):
# the timer zbus itself runs on.
async-io = "2"

# The user's folders as the system names them, off Linux (ADR-035).
[target.'cfg(not(target_os = "linux"))'.dependencies]
dirs.workspace = true

# A settings portal of the tests' own, over a pair of sockets.
[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = { version = "5", features = ["p2p"] }

[dev-dependencies]
dirs.workspace = true
plist.workspace = true
skwir-core = { workspace = true, features = ["testing"] }
proptest.workspace = true
tempfile.workspace = true
# Reads back the PDFs the print helper makes (`print_job`'s tests).
lopdf = { version = "0.46", default-features = false }

[lints]
workspace = true
