[package]
name = "bibli-platform"
description = "bibli platform adapters: MIME, icons, thumbnails, places, volumes, per OS"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bibli-core.workspace = true
anyhow.workspace = true
serde.workspace = true
tracing.workspace = true
# Zip packages (`package`): Word and OpenDocument files, EPUB, 3MF, KMZ,
# workbooks; the version and inflater already in the tree.
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }

open.workspace = true
md5.workspace = true
image = { workspace = true, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico", "qoi", "tga", "pnm", "exr", "dds"] }
png.workspace = true
parking_lot.workspace = true
tempfile.workspace = true
serde_json.workspace = true
jiff.workspace = true
scraper = "0.24"
# The versions scraper itself builds on: publisher stylesheets are parsed and
# matched against its tree, and XHTML read as XML is built into that tree.
cssparser = "0.35"
selectors = "0.31"
markup5ever = "0.35"
ego-tree = "0.10"
roxmltree.workspace = true
# SVG pictures in documents, and fixed-layout pages drawn as SVG with the
# book's fonts; the version and features gpui already links.
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
# Font metrics for laying out a fixed page's text; the version fontdb uses.
ttf-parser = "0.25"
# Compressed drawings (`.svgz`), inflated within a bound; the version and
# backend already in the tree.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
percent-encoding = "2"
encoding_rs = "0.8"
crossbeam-channel.workspace = true
rustix = { workspace = true, features = ["process", "event", "system"] }
futures-lite = "2"
kamadak-exif = "0.6"
# The desktop's type database (shared-mime-info): Linux's own, and the
# fallback of the system's types elsewhere (ADR-037; vendored, built on
# every system).
xdg-mime.workspace = true
mime.workspace = true

# The desktop's keyring (`secrets`): the client and features gpui already links.
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
oo7 = { version = "0.5", default-features = false, features = ["async-std", "native_crypto"] }

# Windows' own calls (ADR-035): the drives, the user's SID, the types
# the registry knows (ADR-037).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_UI_Shell"] }
# The shell's thumbnails (ADR-041): its COM interfaces, through the
# version of `windows` gpui already links.
# The shell's icons, from the system image list (system_icons).
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# macOS's own calls (ADR-035): the calendar's first weekday, the
# Keychain, the types the system knows (ADR-037). The versions already in
# the tree.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSCalendar", "NSDictionary", "NSEnumerator", "NSError", "NSGeometry", "NSString", "NSURL"] }
objc2-uniform-type-identifiers = { version = "0.3", default-features = false, features = ["std", "UTCoreTypes", "UTType"] }
# The system's icons, drawn by NSImage (system_icons).
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSGraphicsContext", "NSImage", "NSImageRep", "NSWorkspace", "objc2-core-graphics", "objc2-uniform-type-identifiers"] }
# Quick Look's thumbnails, read as pixels (ADR-041).
objc2-quick-look-thumbnailing = { version = "0.3", default-features = false, features = ["std", "bitflags", "block2", "objc2-core-foundation", "objc2-core-graphics", "QLThumbnailGenerationRequest", "QLThumbnailGenerator", "QLThumbnailRepresentation"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGImage"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
block2 = "0.6"
security-framework = "3"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
freedesktop-icons.workspace = true

# The user's folders as the system names them, off Linux (ADR-035).
[target.'cfg(not(target_os = "linux"))'.dependencies]
dirs.workspace = true

[dev-dependencies]
dirs.workspace = true
bibli-core = { workspace = true, features = ["testing"] }
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
