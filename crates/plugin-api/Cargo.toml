[package]
name = "skwir-plugin-api"
description = "skwir: what a plugin from outside skwir is and speaks, as a program or a WebAssembly module (ADR-045, ADR-046)"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true

# A plugin built as a WebAssembly module: its bindings to skwir's host.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = { version = "0.57", default-features = false, features = ["macros", "realloc"] }

[dev-dependencies]
# A manifest as a plugin writes it.
toml.workspace = true

[lints]
workspace = true
