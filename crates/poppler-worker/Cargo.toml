[package]
name = "skwir-poppler-worker"
description = "On-demand Poppler document worker for skwir"
version.workspace = true
publish.workspace = true
edition.workspace = true
# Our source is Apache-2.0 like the rest of skwir. The worker binary
# links Poppler, whose core is GPL v2 or v3: whoever distributes this
# executable distributes it under the GPL v3 (ADR-042).
license.workspace = true
rust-version.workspace = true

[dependencies]
skwir-core.workspace = true
anyhow.workspace = true
poppler-rs = "=0.26.0"
glib = "0.22"
cairo-rs = "0.22"

[lints]
workspace = true
