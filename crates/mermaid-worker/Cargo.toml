[package]
name = "skwir-mermaid-worker"
description = "skwir helper: Mermaid diagrams laid out as SVG, in a process of its own"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# The Rust Mermaid Zed also uses; SVG only, made for resvg. Every kind of
# diagram is asked for (merman draws only those its features name), and
# the force-directed layout an architecture diagram needs.
merman = { version = "0.9.2", default-features = false, features = ["svg", "all-diagrams", "layout-cytoscape"] }

[lints]
workspace = true
