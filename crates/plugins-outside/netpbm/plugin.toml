# A thumbnailer from outside skwir (ADR-045, ADR-046): binary Netpbm
# pictures drawn small, as a WebAssembly module that reads them through
# skwir and answers a PNG.
id = "netpbm"
title = "Netpbm pictures"
description = "Thumbnails and previews of PPM and PGM pictures, from a WebAssembly module"
category = "previews"
capabilities = ["read"]
api = 1

[run]
module = "netpbm.wasm"

[[thumbnails]]
types = ["image/x-portable-pixmap", "image/x-portable-graymap"]

# Previewed as the PNG it makes of them, by skwir's own picture view:
# zoomed, fitted, compared as any picture is; a file of several
# pictures one after another, a page each.
[[previews]]
types = ["image/x-portable-pixmap", "image/x-portable-graymap"]
converts = true
pages = true
