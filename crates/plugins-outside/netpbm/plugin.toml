# A thumbnailer from outside bibli (ADR-045, ADR-046): binary Netpbm
# pictures drawn small, as a WebAssembly module that reads them through
# bibli and answers a PNG.
id = "netpbm"
title = "Netpbm pictures"
description = "Thumbnails and previews of PPM and PGM pictures, from a WebAssembly module"
category = "previews"
capabilities = ["read"]
api = 3

[run]
module = "netpbm.wasm"

[[thumbnails]]
types = ["image/x-portable-pixmap", "image/x-portable-graymap"]

# Previewed as the PNG it makes of them, by bibli's own picture view:
# zoomed, fitted, compared as any picture is (protocol version 2); a
# file of several pictures one after another, a page each (version 3).
[[previews]]
types = ["image/x-portable-pixmap", "image/x-portable-graymap"]
converts = true
pages = true
