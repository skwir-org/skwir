# A plugin from outside skwir (docs/plugins/README.md): copy this folder,
# give it your own id, and build it with `just plugins`.
id = "word-count"
# What it says to a person is a message of its catalogs (protocol 2):
# l10n/en.ftl beside this file, and a file a language (fr.ftl, zh-Hans.ftl),
# said in the reader's language. Text written here instead is shown as is.
title = { id = "plugin-title" }
description = { id = "plugin-description" }
category = "files"
capabilities = ["read"]
api = 2

[run]
# The module `just plugins` builds; a program would say
# program = "bin/word-count" instead.
module = "word_count.wasm"

[[fields]]
key = "word-count.words"
label = { id = "words-label" }
types = ["text/plain", "text/markdown"]

[[commands]]
name = "word-count.count"
title = { id = "count-title" }
description = { id = "count-description" }
effect = "reads"
topic = "files"

[[commands]]
name = "word-count.copy"
title = { id = "copy-title" }
description = { id = "copy-description" }
effect = "reads"
topic = "files"
