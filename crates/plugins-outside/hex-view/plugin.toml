# The hexadecimal preview as a WebAssembly module: what the built-in
# hex plugin shows, the same (Phase 6's gate, ADR-046), in the reader's
# language (protocol 2: its catalogs are l10n/ beside this file).
id = "hex-view"
title = { id = "plugin-title" }
description = { id = "plugin-description" }
category = "previews"
capabilities = ["read"]
api = 2

[run]
module = "hex_view.wasm"

[[previews]]
types = ["application/octet-stream"]
priority = -100
shows_bytes = true
