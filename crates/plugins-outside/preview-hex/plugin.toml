# The hexadecimal preview as a WebAssembly module: what the built-in
# preview-hex plugin shows, the same (Phase 6's gate, ADR-046).
id = "hex-view"
title = "Preview: hexadecimal (WebAssembly)"
description = "Inspect any file as hexadecimal bytes, from a WebAssembly module"
category = "previews"
capabilities = ["read"]

[run]
module = "hex_view.wasm"

[[previews]]
types = ["application/octet-stream"]
priority = -100
shows_bytes = true
