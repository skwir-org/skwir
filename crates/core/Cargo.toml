[package]
name = "bibli-core"
description = "bibli core: entries, locations, commands, operations, plans, registries"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tempfile.workspace = true
rustix = { workspace = true, features = ["fs", "time", "thread", "event", "process"] }
crossbeam-channel.workspace = true
parking_lot.workspace = true
notify.workspace = true
schemars.workspace = true
thiserror.workspace = true
dirs.workspace = true
blake3.workspace = true
trash.workspace = true
tracing.workspace = true
indexmap.workspace = true
# Only for `testing`, which plugins ask for in their dev-dependencies.
proptest = { workspace = true, optional = true }

[features]
# Inputs no file should hold, for tests of what reads files (`testing`).
testing = ["dep:proptest"]

[target.'cfg(unix)'.dependencies]
xattr.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
inotify.workspace = true
# `sync_file_range`, which rustix lacks (a copy written through, `op::sys`).
libc = "0.2"
# The local time a trash record says, as the `trash` crate, which brings
# it, writes it (`op::put_trash`).
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# macOS's own calls rustix lacks there (clonefile, mkfifo), and its trash
# (`trashItemAtURL`, which says where an item went): ADR-035. The objc2
# versions the `trash` crate already brings.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSFileManager", "NSString", "NSURL"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_SystemServices"] }

[dev-dependencies]
proptest.workspace = true
dirs.workspace = true
blake3.workspace = true

[lints]
workspace = true
