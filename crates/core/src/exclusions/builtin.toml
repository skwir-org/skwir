# The exclusions skwir ships (ADR-125), read by `exclusions/mod.rs`: the
# files and folders skwir treats apart, in categories. A category's
# switches say which roles they are excluded from: `searches` (searches,
# tag counts and the timeline never look at them below the folder they
# look in), `agents` (never named, listed or read for an agent, a plugin
# from outside or a model) and `index` (never harvested by an index). Ids
# become `skwir.<id>`.
#
# An entry's `pattern` is a name, anywhere (`node_modules`); a path, from
# `~` or `/`, or from the base `under` names (empty, the base itself; see
# below: the XDG folders, the tools' homes), which follows its variable;
# or a glob of either (`*` within a name, `**` across names). `names =
# "files"` says it names files (`*.kdbx`); without it, folders. `beside`
# asks for a sibling, a name or a glob; `holding`, instead of `pattern`, a
# file a folder holds. `systems` limits an entry to some systems; without
# it, it holds on every one. In a category kept from agents, an entry a
# variable moved stays excluded where it was too.
#
# A tool's folder is listed whole only where nobody writes in it: where
# settings, credentials or the user's own files sit beside the store, the
# store's subfolders are listed (~/.cargo/registry, never ~/.cargo). A name
# is a tool's own; an ordinary word (target, obj) comes only with the
# sibling that says which tool made it. What people commit and patch by
# hand beside their project (vendor, Pods, bower_components) is never
# excluded: a search of the project finds their changes there.

# The folders entries are written under (`under`), each a path that
# starts at the variable that moves it, with what stands for it unset
# (`${NAME:-default}`, the shell's syntax; a list's first folder). The
# variables are skwir's own environment's, else the login shell's.

[[base]]
name = "data"
path = "${XDG_DATA_HOME:-~/.local/share}"

[[base]]
name = "config"
path = "${XDG_CONFIG_HOME:-~/.config}"

[[base]]
name = "state"
path = "${XDG_STATE_HOME:-~/.local/state}"

[[base]]
name = "cache"
path = "${XDG_CACHE_HOME:-~/.cache}"

# Where the session's sockets and keys of the moment live; none where the
# system has none.
[[base]]
name = "runtime"
path = "$XDG_RUNTIME_DIR"

