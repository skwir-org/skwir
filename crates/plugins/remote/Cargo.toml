[package]
name = "skwir-plugin-remote"
description = "skwir plugin: remote folders (SFTP, SMB, WebDAV, FTP, NFS, rclone) through sshfs, GVfs, KIO, rclone or the system's mounts"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
skwir-core.workspace = true
skwir-platform.workspace = true
anyhow.workspace = true
crossbeam-channel.workspace = true
# The login of rclone's remote control on Windows' loopback (`rc`), and
# its SHA-1 for a logon task's rclone (`--rc-htpasswd`, ADR-087).
getrandom = "0.3"
sha1_smol = "1"
parking_lot.workspace = true
roxmltree.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true

# The desktop's remotes reached over the session bus: whether GVfs or
# kio-fuse is there, and kio-fuse's calls (the zbus the platform links).
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[dev-dependencies]
dirs.workspace = true
tempfile.workspace = true

[lints]
workspace = true
