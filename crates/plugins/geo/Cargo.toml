[package]
name = "bibli-plugin-geo"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bibli-core.workspace = true
bibli-platform.workspace = true
anyhow.workspace = true
jiff.workspace = true
serde_json.workspace = true
serde.workspace = true
schemars.workspace = true
parking_lot.workspace = true
tracing.workspace = true
# Streaming XML: a day of GPS logging is tens of megabytes; the version
# already in the tree.
quick-xml = "0.42"
# Track thumbnails, as map-tiles draws its outline.
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }

[dev-dependencies]
# The tests write KMZ files.
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tempfile.workspace = true

[lints]
workspace = true
