[package]
name = "bibli-plugin-preview-tables"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bibli-core.workspace = true
bibli-platform.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
csv = "1"
# Excel workbooks, read cell by cell; the zip version already in the tree,
# walked first to bound what calamine reads whole.
calamine = { version = "0.36", default-features = false }
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# SQLite databases, read by the system's libsqlite3 (ADR-022), not a
# bundled copy.
rusqlite = { version = "0.40", default-features = false, features = ["hooks"] }
# A line's keys in the order it writes them.
indexmap = { workspace = true, features = ["serde"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
