[package]
name = "skwir-plugin-map-tiles"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
# Named in the User-Agent, as the tile policy asks: the project's own
# domain, a contact that stays whoever hosts the code.
homepage.workspace = true

[dependencies]
skwir-core.workspace = true
skwir-platform = { workspace = true, features = ["http"] }
anyhow.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
toml.workspace = true
tracing.workspace = true
# Tile archives: PMTiles' gzipped directories, the version and backend
# already in the tree; MBTiles read by the system's libsqlite3 (ADR-022),
# as the tables preview reads a database: built in on Windows, which has
# none to link, and where `bundled-sqlite` asks.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
rusqlite = { version = "0.41", default-features = false, features = ["hooks", "bundled-windows"] }
# Rasterizes the offline outline; the version resvg already brings.
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
# The download thread's own runtime, which runs the platform's HTTP
# client (`skwir_platform::http`, ADR-020, moved there by ADR-142).
tokio = { version = "1", features = ["rt", "time", "sync", "net"] }

[dev-dependencies]
skwir-core = { workspace = true, features = ["testing"] }
proptest.workspace = true
tempfile.workspace = true
# The tests write the tiles of an archive.
image = { workspace = true, features = ["png"] }


[features]
# SQLite built in, for a build that cannot count on the system's being
# as new as rusqlite needs (ADR-022, 2026-11-03).
bundled-sqlite = ["rusqlite/bundled"]

[lints]
workspace = true
