[package]
name = "skwir-plugin-map-tiles"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
# Named in the User-Agent, as the tile policy asks: the project's own
# domain, a contact that stays whoever hosts the code.
homepage.workspace = true

[dependencies]
skwir-core.workspace = true
skwir-platform.workspace = true
anyhow.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
toml.workspace = true
tracing.workspace = true
# Tile archives: PMTiles' gzipped directories, the version and backend
# already in the tree; MBTiles read by the system's libsqlite3 (ADR-022),
# as the tables preview reads a database: built in on Windows, which has
# none to link.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
rusqlite = { version = "0.40", default-features = false, features = ["hooks", "bundled-windows"] }
# Rasterizes the offline outline; the version resvg already brings.
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
# The HTTP client (ADR-020): HTTP/2 where the server speaks it, on a runtime
# of the download thread's own, with the system's certificates. The crates
# and versions gpui already brings; rustls with ring, as the tree has it.
tokio = { version = "1", features = ["rt", "time", "sync", "net"] }
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "tls12"] }
http-body-util = "0.1"
bytes = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"

[dev-dependencies]
skwir-core = { workspace = true, features = ["testing"] }
proptest.workspace = true
tempfile.workspace = true
# The tests write the tiles of an archive.
image = { workspace = true, features = ["png"] }
# A local HTTPS server speaking HTTP/2, for the client's tests.
tokio = { version = "1", features = ["rt", "time", "sync", "net", "macros"] }
hyper = { version = "1", features = ["server"] }
hyper-util = { version = "0.1", features = ["server-auto"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }


[lints]
workspace = true
