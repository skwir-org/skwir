[package]
name = "skwir-plugin-tables"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
skwir-core.workspace = true
skwir-platform.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
csv = "1"
# Excel workbooks, read cell by cell, their zip walked first
# (`skwir_platform::package`) to bound what calamine reads whole.
calamine = { version = "0.38", default-features = false }
# SQLite databases, read by the system's libsqlite3 (ADR-022), not a
# bundled copy; built in on Windows, which has none to link, and where
# `bundled-sqlite` asks.
rusqlite = { version = "0.41", default-features = false, features = ["hooks", "bundled-windows"] }
# A line's keys in the order it writes them.
indexmap = { workspace = true, features = ["serde"] }

[dev-dependencies]
# The tests write workbooks.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tempfile.workspace = true

[features]
# SQLite built in, for a build that cannot count on the system's being
# as new as rusqlite needs (ADR-022, 2026-11-03).
bundled-sqlite = ["rusqlite/bundled"]

[lints]
workspace = true
