[package]
name = "bibli-plugin-preview-documents"
description = "bibli plugin: documents previews"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bibli-core.workspace = true
bibli-platform.workspace = true
toml.workspace = true
anyhow.workspace = true
parking_lot.workspace = true
