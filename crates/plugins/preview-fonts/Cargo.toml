[package]
name = "bibli-plugin-preview-fonts"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bibli-core.workspace = true
bibli-platform.workspace = true
anyhow.workspace = true
fontdue = "0.9"
ttf-parser = "0.25"
# Web fonts: WOFF2's decoder (brotli, transformed tables) in pure Rust; WOFF
# is inflated here, within the input bound, by the flate2 already in the tree.
wuff = { version = "0.2", default-features = false, features = ["brotli"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }

[dev-dependencies]
tempfile.workspace = true
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }

[lints]
workspace = true
