[package]
name = "bibli-plugin-preview-epub"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.88"

[dependencies]
bibli-core.workspace = true
bibli-platform.workspace = true
anyhow.workspace = true
serde_json.workspace = true
rbook = "0.7"
# rbook already selects flate2 with zlib-rs; zopfli (a compressor) is never needed.
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
roxmltree.workspace = true
percent-encoding = "2"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
