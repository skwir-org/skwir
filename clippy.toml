# Names clippy takes as words in doc comments, beside its own (`..`):
# GVfs, the desktop's remote file systems, and WebDAV (ADR-077);
# BitLocker, Windows' drive encryption (ADR-088); LXQt, a desktop whose
# fonts are read (ADR-117); JetBrains, whose Mono skwir carries (ADR-118);
# RaTeX, KaTeX and MathJax, formulas' typesetters, MathML and LaTeXML, its writer,
# and JupyterLab, whose rules for math in a cell skwir follows (ADR-129).
doc-valid-idents = ["GVfs", "WebDAV", "BitLocker", "LXQt", "JetBrains", "RaTeX", "KaTeX", "LaTeXML", "MathML", "MathJax", "JupyterLab", ".."]

# A program is made by skwir_platform::process::command alone, which on
# Windows starts it without a console window: skwir.exe has no console
# (ADR-074), so a console program started otherwise opens one of its own.
# Exceptions are allowed where they stand, with the reason: tests, run
# from a console; build scripts; helpers, whose own console is unseen.
disallowed-methods = [
    { path = "std::process::Command::new", reason = "make it with skwir_platform::process::command: on Windows a program started otherwise opens a console window" },
]
