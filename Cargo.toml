[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/platform",
    "crates/ui",
    "crates/plugins/*",
    "crates/bench",
]
# Toolkit spikes live in their own workspace so their heavy dependency
# trees never touch the main build.
exclude = ["spikes"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/venator/bibli"

[workspace.dependencies]
bibli-core = { path = "crates/core" }
bibli-platform = { path = "crates/platform" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
rustix = { version = "1", features = ["fs"] }
rayon = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
many_single_char_names = "allow"

[profile.release]
debug = 1          # keep symbols for flamegraphs
lto = "thin"
codegen-units = 4

[profile.bench]
inherits = "release"
