[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/platform",
    "crates/ui",
    "crates/plugins/*",
    "crates/bench",
    "crates/bibli",
]
# Toolkit spikes live in their own workspace so their heavy dependency
# trees never touch the main build.
exclude = ["spikes"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/venator/bibli"

[workspace.dependencies]
bibli-core = { path = "crates/core" }
bibli-platform = { path = "crates/platform" }
bibli-ui = { path = "crates/ui" }
bibli-plugin-places = { path = "crates/plugins/places" }
bibli-plugin-open-with = { path = "crates/plugins/open-with" }
bibli-plugin-ops-basic = { path = "crates/plugins/ops-basic" }
bibli-plugin-thumbnails = { path = "crates/plugins/thumbnails" }

# UI toolkit (ADR-001). Pinned exactly: the API moves between releases.
gpui = "=0.2.2"
flume = "0.12"
nucleo-matcher = "0.3"
open = "5"
xdg-mime = "0.4"
freedesktop-icons = "0.4"
mime = "0.3"
md5 = "0.8"

anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml = "0.9"
rustix = { version = "1", features = ["fs"] }
rayon = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
png = "0.17"
crossbeam-channel = "0.5"
parking_lot = "0.12"
notify = "8"
inotify = "0.11"
schemars = "1"
thiserror = "2"
dirs = "7"
blake3 = "1"
trash = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-segmentation = "1"
jiff = "0.2"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
indexmap = "2"
proptest = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "allow"   # crate- and module-level docs are required by review, item docs are not yet

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
many_single_char_names = "allow"
too_many_lines = "allow"
type_complexity = "allow"
return_self_not_must_use = "allow"
wildcard_imports = "allow"

[profile.release]
debug = 1          # keep symbols for flamegraphs
lto = "thin"
codegen-units = 4

[profile.bench]
inherits = "release"

# Vendored gpui 0.2.2 with bibli's patches (see vendor/gpui/README.bibli.md).
# Remove this table and the vendor directory once the patches are upstream.
[patch.crates-io]
gpui = { path = "vendor/gpui" }
