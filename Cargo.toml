[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/platform",
    "crates/ui",
    "crates/plugins/*",
    "crates/bench",
    "crates/bibli",
    "crates/alloc",
    "crates/pdf-worker",
    "crates/poppler-worker",
    "crates/mupdf-worker",
    "crates/media-worker",
    "crates/archive-worker",
    "crates/mermaid-worker",
    "crates/model-worker",
]
# The native workers link Poppler, MuPDF, GStreamer and libarchive. They are optional
# at runtime and stay out of the default build so the application, plugins and
# tests compile without those libraries; `just workers` / `just test-all`
# include them, and CI runs the full set inside the Nix shell.
default-members = [
    "crates/core",
    "crates/platform",
    "crates/ui",
    "crates/plugins/*",
    "crates/bench",
    "crates/bibli",
    "crates/alloc",
    "crates/pdf-worker",
    "crates/mermaid-worker",
    "crates/model-worker",
]
# Toolkit spikes live in their own workspace so their heavy dependency
# trees never touch the main build.
exclude = ["spikes"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"
repository = "https://github.com/venator/bibli"

[workspace.dependencies]
bibli-core = { path = "crates/core" }
bibli-platform = { path = "crates/platform" }
bibli-alloc = { path = "crates/alloc" }
bibli-ui = { path = "crates/ui" }
bibli-plugin-places = { path = "crates/plugins/places" }
bibli-plugin-open-with = { path = "crates/plugins/open-with" }
bibli-plugin-ops-basic = { path = "crates/plugins/ops-basic" }
bibli-plugin-thumbnails = { path = "crates/plugins/thumbnails" }
bibli-plugin-query = { path = "crates/plugins/query" }
bibli-plugin-shelf = { path = "crates/plugins/shelf" }
bibli-plugin-rename-bulk = { path = "crates/plugins/rename-bulk" }
bibli-plugin-edit-as-buffer = { path = "crates/plugins/edit-as-buffer" }
bibli-plugin-jump = { path = "crates/plugins/jump" }
bibli-plugin-tags = { path = "crates/plugins/tags" }
bibli-plugin-xmp = { path = "crates/plugins/xmp" }
bibli-plugin-tagspaces = { path = "crates/plugins/tagspaces" }
bibli-plugin-shell = { path = "crates/plugins/shell" }
bibli-plugin-usage = { path = "crates/plugins/usage" }
bibli-plugin-timeline = { path = "crates/plugins/timeline" }
bibli-plugin-preview-media = { path = "crates/plugins/preview-media" }
bibli-plugin-preview-hex = { path = "crates/plugins/preview-hex" }
bibli-plugin-preview-markdown = { path = "crates/plugins/preview-markdown" }
bibli-plugin-preview-archives = { path = "crates/plugins/preview-archives" }
bibli-plugin-preview-epub = { path = "crates/plugins/preview-epub" }
bibli-plugin-preview-tables = { path = "crates/plugins/preview-tables" }
bibli-plugin-preview-playlists = { path = "crates/plugins/preview-playlists" }
bibli-plugin-mpris = { path = "crates/plugins/mpris" }
bibli-plugin-preview-structured = { path = "crates/plugins/preview-structured" }
bibli-plugin-preview-fonts = { path = "crates/plugins/preview-fonts" }
bibli-plugin-preview-models = { path = "crates/plugins/preview-models" }
bibli-plugin-preview-circuits = { path = "crates/plugins/preview-circuits" }
bibli-plugin-preview-email = { path = "crates/plugins/preview-email" }
bibli-plugin-preview-comics = { path = "crates/plugins/preview-comics" }
bibli-plugin-preview-documents = { path = "crates/plugins/preview-documents" }
bibli-plugin-terminal = { path = "crates/plugins/terminal" }
bibli-plugin-geo = { path = "crates/plugins/geo" }
bibli-plugin-map-tiles = { path = "crates/plugins/map-tiles" }
bibli-plugin-vim = { path = "crates/plugins/vim" }

# UI toolkit (ADR-001). Pinned exactly: the API moves between releases.
gpui = "=0.2.2"
flume = "0.12"
nucleo-matcher = "0.3"
ignore = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
globset = "0.4"
regex = "1"
xattr = "1"
roxmltree = "0.21"
humantime = "2"
open = "5"
xdg-mime = "0.4"
freedesktop-icons = "0.4"
mime = "0.3"
md5 = "0.8"

anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml = "0.9"
rustix = { version = "1", features = ["fs"] }
rayon = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
png = "0.17"
crossbeam-channel = "0.5"
parking_lot = "0.12"
# Pinned: bibli-alloc sets two options by their number in the compiled
# mimalloc's enum (ADR-011); an upgrade is deliberate and its test re-run.
mimalloc = { version = "=0.1.52", default-features = false }
libmimalloc-sys = { version = "=0.1.49", default-features = false, features = ["extended"] }
notify = "8"
inotify = "0.11"
schemars = "1"
thiserror = "2"
dirs = "7"
blake3 = "1"
trash = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-segmentation = "1"
jiff = "0.2"
plist = { version = "1", default-features = false }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
# bat's grammars over syntect's defaults (TypeScript, Nix, Dockerfile, TOML…),
# built for the same pure-Rust regex engine.
two-face = { version = "0.5", default-features = false, features = ["syntect-default-fancy"] }
indexmap = "2"
proptest = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "allow"   # crate- and module-level docs are required by review, item docs are not yet

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
many_single_char_names = "allow"
too_many_lines = "allow"
type_complexity = "allow"
return_self_not_must_use = "allow"
wildcard_imports = "allow"

[profile.release]
debug = 1          # keep symbols for flamegraphs
lto = "thin"
codegen-units = 4

[profile.bench]
inherits = "release"

# What is shipped (`just dist`): release without the symbols it keeps for
# flamegraphs, std's included. Function names stay, so a panic's backtrace
# still reads; a packager splits them off if they must go too.
[profile.dist]
inherits = "release"
debug = false
strip = "debuginfo"

# Vendored gpui 0.2.2 with bibli's patches (see vendor/gpui/README.bibli.md).
# Remove this table and the vendor directory once the patches are upstream.
[patch.crates-io]
gpui = { path = "vendor/gpui" }
