[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/platform",
    "crates/ui",
    "crates/plugins/*",
    "crates/plugin-api",
    "crates/extend",
    "crates/plugins-outside/*",
    "crates/bench",
    "crates/skwir",
    "crates/alloc",
    "crates/pdf-worker",
    "crates/poppler-worker",
    "crates/mupdf-worker",
    "crates/media-worker",
    "crates/archive-worker",
    "crates/mermaid-worker",
    "crates/model-worker",
    "crates/module-worker",
]
# The native workers link Poppler, MuPDF, GStreamer and libarchive. They are optional
# at runtime and stay out of the default build so the application, plugins and
# tests compile without those libraries; `just workers` / `just test-all`
# include them; release-check and the manual full workflow run the full set.
default-members = [
    "crates/core",
    "crates/platform",
    "crates/ui",
    "crates/plugins/*",
    "crates/plugin-api",
    "crates/extend",
    "crates/plugins-outside/*",
    "crates/bench",
    "crates/skwir",
    "crates/alloc",
    "crates/pdf-worker",
    "crates/mermaid-worker",
    "crates/model-worker",
    "crates/module-worker",
]
# Toolkit spikes live in their own workspace so their heavy dependency
# trees never touch the main build.
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.96"
repository = "https://github.com/skwir-org/skwir"
homepage = "https://skwir.org"
# None of them is published to crates.io; a crate meant for others (the
# plugin API, once stable) says so itself.
publish = false

[workspace.dependencies]
skwir-core = { path = "crates/core" }
skwir-platform = { path = "crates/platform" }
skwir-alloc = { path = "crates/alloc" }
skwir-ui = { path = "crates/ui" }
skwir-plugin-places = { path = "crates/plugins/places" }
skwir-plugin-open-with = { path = "crates/plugins/open-with" }
skwir-plugin-ops-basic = { path = "crates/plugins/ops-basic" }
skwir-plugin-thumbnails = { path = "crates/plugins/thumbnails" }
skwir-plugin-query = { path = "crates/plugins/query" }
skwir-plugin-shelf = { path = "crates/plugins/shelf" }
skwir-plugin-trash = { path = "crates/plugins/trash" }
skwir-plugin-rename-bulk = { path = "crates/plugins/rename-bulk" }
skwir-plugin-edit-as-buffer = { path = "crates/plugins/edit-as-buffer" }
skwir-plugin-jump = { path = "crates/plugins/jump" }
skwir-plugin-tags = { path = "crates/plugins/tags" }
skwir-plugin-xmp = { path = "crates/plugins/xmp" }
skwir-plugin-tagspaces = { path = "crates/plugins/tagspaces" }
skwir-plugin-name-tags = { path = "crates/plugins/name-tags" }
skwir-plugin-shell = { path = "crates/plugins/shell" }
skwir-plugin-usage = { path = "crates/plugins/usage" }
skwir-plugin-timeline = { path = "crates/plugins/timeline" }
skwir-plugin-media = { path = "crates/plugins/media" }
skwir-plugin-hex = { path = "crates/plugins/hex" }
skwir-plugin-markdown = { path = "crates/plugins/markdown" }
skwir-plugin-archives = { path = "crates/plugins/archives" }
skwir-plugin-epub = { path = "crates/plugins/epub" }
skwir-plugin-tables = { path = "crates/plugins/tables" }
skwir-plugin-playlists = { path = "crates/plugins/playlists" }
skwir-plugin-mpris = { path = "crates/plugins/mpris" }
skwir-plugin-control = { path = "crates/plugins/control" }
skwir-plugin-api = { path = "crates/plugin-api" }
skwir-extend = { path = "crates/extend" }
skwir-plugin-structured-data = { path = "crates/plugins/structured-data" }
skwir-plugin-fonts = { path = "crates/plugins/fonts" }
skwir-plugin-models = { path = "crates/plugins/models" }
skwir-plugin-circuits = { path = "crates/plugins/circuits" }
skwir-plugin-email = { path = "crates/plugins/email" }
skwir-plugin-comics = { path = "crates/plugins/comics" }
skwir-plugin-documents = { path = "crates/plugins/documents" }
skwir-plugin-terminal = { path = "crates/plugins/terminal" }
skwir-plugin-geo = { path = "crates/plugins/geo" }
skwir-plugin-map-tiles = { path = "crates/plugins/map-tiles" }
skwir-plugin-vim = { path = "crates/plugins/vim" }
skwir-plugin-checksums = { path = "crates/plugins/checksums" }

# UI toolkit (ADR-001). Pinned exactly: the API moves between releases.
gpui = "=0.2.2"
flume = "0.12"
nucleo-matcher = "0.3"
ignore = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
globset = "0.4"
regex = "1"
regex-syntax = "0.8"
memchr = "2"
xattr = "1"
roxmltree = "0.21"
humantime = "2"
open = "5"
xdg-mime = "0.4"
mime = "0.3"
md5 = "0.8"
# SHA-256 for the checksums plugin: the version the tree already links.
sha2 = "0.10"

anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml = "0.9"
rustix = { version = "1", features = ["fs"] }
rayon = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
# A JPEG decoded at a reduced scale for its thumbnail (zune-jpeg, image's
# own, decodes it whole); without rayon, one thread per decode.
jpeg-decoder = { version = "0.3", default-features = false }
png = "0.17"
crossbeam-channel = "0.5"
parking_lot = "0.12"
# Pinned: skwir-alloc sets two options by their number in the compiled
# mimalloc's enum (ADR-011); an upgrade is deliberate and its test re-run.
mimalloc = { version = "=0.1.52", default-features = false }
libmimalloc-sys = { version = "=0.1.49", default-features = false, features = ["extended"] }
notify = "8"
inotify = "0.11"
schemars = "1"
thiserror = "2"
dirs = "7"
blake3 = "1"
trash = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-segmentation = "1"
jiff = "0.2"
plist = { version = "1", default-features = false }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
# bat's grammars over syntect's defaults (TypeScript, Nix, Dockerfile, TOML…),
# built for the same pure-Rust regex engine.
two-face = { version = "0.5", default-features = false, features = ["syntect-default-fancy"] }
indexmap = "2"
proptest = "1"
tempfile = "3"
# Windows' own calls (ADR-035): the version most of the tree already links.
windows-sys = "0.61"

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "allow"   # crate- and module-level docs are required by review, item docs are not yet

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
many_single_char_names = "allow"
too_many_lines = "allow"
type_complexity = "allow"
return_self_not_must_use = "allow"
wildcard_imports = "allow"

# Debug info stays in `.dwo` files beside the objects, out of the link:
# it was 92 % of a test binary (646 of 702 MB for skwir-ui's), and eight
# such links at once ran a 30 GB machine out of memory. Backtraces and
# debuggers read it where it is. macOS splits it so already; Cargo leaves
# the option out where a target lacks it (Windows).
[profile.dev]
split-debuginfo = "unpacked"

[profile.release]
debug = 1          # keep symbols for flamegraphs
lto = "thin"
codegen-units = 4

[profile.bench]
inherits = "release"

# The module helper (`skwir-module-worker`, ADR-046) compiles a plugin's
# module with Cranelift when it starts: unoptimized, that takes seconds
# where it takes a fraction of one, longer than skwir waits for a helper
# to start (a test starts it unoptimized). Only the helper uses these.
[profile.dev.package.cranelift-codegen]
opt-level = 2
[profile.dev.package.cranelift-frontend]
opt-level = 2
[profile.dev.package.regalloc2]
opt-level = 2
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 2
[profile.dev.package.wasmtime-environ]
opt-level = 2
[profile.dev.package.wasmparser]
opt-level = 2
[profile.dev.package.wit-component]
opt-level = 2

# What is shipped (`just dist`): release without the symbols it keeps for
# flamegraphs, std's included. Function names stay, so a panic's backtrace
# still reads; a packager splits them off if they must go too.
[profile.dist]
inherits = "release"
debug = false
strip = "debuginfo"

# Vendored gpui 0.2.2 and xdg-mime 0.4.0 with skwir's patches (see each
# one's README.skwir.md). Remove an entry and its directory once its
# patches are upstream.
[patch.crates-io]
gpui = { path = "vendor/gpui" }
xdg-mime = { path = "vendor/xdg-mime" }
