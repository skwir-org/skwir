[package]
name = "skwird-protocol"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false
description = "skwird's protocol: the messages a client and an engine say, as JSON lines"
# serde and serde_json alone, at versions skwir's lockfile holds, so that
# the copy a client keeps builds on its own (docs/DESIGN.md, Protocol).

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
