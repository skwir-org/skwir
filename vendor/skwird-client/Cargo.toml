[package]
name = "skwird-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false
description = "skwird's client: finds or starts an engine, and asks it; and a fake engine for clients' tests"
# Like skwird-protocol, serde and serde_json beside it, and windows-sys on
# Windows, so that the copies a client keeps build on their own
# (docs/DESIGN.md, Protocol).

[dependencies]
skwird-protocol = { path = "../skwird-protocol", version = "0.1.0" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }
