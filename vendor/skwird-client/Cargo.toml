[package]
name = "skwird-client"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false
description = "skwird's client: finds or starts an engine, and asks it; and a fake engine for clients' tests"
# Like skwird-protocol, serde and serde_json alone beside it, so that the
# copies a client keeps build on their own (docs/DESIGN.md, Protocol).

[dependencies]
skwird-protocol = { path = "../skwird-protocol", version = "0.0.0" }
