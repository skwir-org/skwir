# Separate workspace for the Phase 0 toolkit spikes. Heavy dependency trees
# stay out of the main build. See README.md for the measurement contract.
[workspace]
resolver = "2"
members = ["common", "gpui", "floem"]

[workspace.dependencies]
spike-common = { path = "common" }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"

[profile.release]
debug = 1
