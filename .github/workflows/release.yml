name: release
# Tags validate metadata only. Local commands build and upload a draft (ADR-053).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  agree:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: One version and a dated changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 tools/release/release.py metadata "$RELEASE_TAG"
