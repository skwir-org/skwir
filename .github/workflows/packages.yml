name: packages
# Manual fallback and reusable job for full.yml (ADR-053).
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  appimage:
    name: AppImage and tarball (Ubuntu 22.04 baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - name: Room and user namespaces
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Build and check in separate Ubuntu roots
        run: nix develop --command just package-appimage
      - uses: actions/upload-artifact@v7
        with:
          name: skwir-appimage
          path: target/package/appimage/*
          if-no-files-found: error

  appimage-portability:
    needs: appimage
    name: AppImage and tarball on ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "fedora:44"]
    container:
      image: ${{ matrix.image }}
      # The real app runs nested bubblewrap sandboxes in these disposable
      # test containers; Docker's default profiles refuse their namespaces.
      options: --cap-add SYS_ADMIN --security-opt seccomp=unconfined --security-opt apparmor=unconfined
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: skwir-appimage
          path: appimage
      - name: Desktop runtime only
        run: |
          if command -v apt-get; then
            apt-get update -q
            # shellcheck disable=SC2046 # one package name per line
            apt-get install -y --no-install-recommends $(sed 's/^libasound2$/libasound2t64/' tools/package/appimage/test-deps)
          else
            dnf install -y python3 binutils tar gzip bubblewrap xorg-x11-server-Xvfb \
              mesa-vulkan-drivers vulkan-loader libwayland-client libxkbcommon \
              libX11 libxcb libXcursor libXi libXrandr fontconfig dejavu-sans-fonts \
              alsa-lib mesa-libgbm libglvnd-egl shared-mime-info
          fi
      - name: Check the same artifacts
        run: |
          cd appimage && sha256sum -c ./*.sha256 && chmod +x ./*.AppImage && cd ..
          python3 tools/package/appimage/check.py appimage/*.AppImage
          python3 tools/package/appimage/check.py appimage/*.tar.gz

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: debian
            image: debian:13
            git: apt-get update -q && apt-get install -y -q --no-install-recommends git ca-certificates
          - distribution: ubuntu
            image: ubuntu:24.04
            git: apt-get update -q && apt-get install -y -q --no-install-recommends git ca-certificates
          - distribution: fedora
            image: fedora:44
            git: dnf -y -q install git
          - distribution: arch
            image: archlinux:latest
            git: pacman -Syu --noconfirm --needed git
    name: ${{ matrix.distribution }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    timeout-minutes: 180
    steps:
      - name: Git
        # Without it the checkout is no repository: the AUR's tarball is
        # made of the tracked files, and a release build names its commit.
        run: ${{ matrix.git }}
      - uses: actions/checkout@v7
      - name: What the build needs
        run: |
          tools/package/linux/prepare.sh ${{ matrix.distribution }}
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Package
        run: |
          case ${{ matrix.distribution }} in
          debian | ubuntu) tools/package/deb.sh ;;
          fedora) tools/package/rpm.sh ;;
          arch) chown -R builder . && su builder -c tools/package/aur/build.sh ;;
          esac
      - name: Installed, checked and run
        run: |
          case ${{ matrix.distribution }} in
          debian | ubuntu) apt-get install -y --no-install-recommends ./target/debian/skwir_*.deb ;;
          fedora) dnf -y install --setopt=install_weak_deps=False target/generate-rpm/skwir-*.rpm ;;
          arch) pacman -U --noconfirm target/aur/skwir-[0-9]*.pkg.tar.zst ;;
          esac
          tools/package/linux/check.sh
          skwir --version
      - uses: actions/upload-artifact@v7
        with:
          name: skwir-${{ matrix.distribution }}
          path: |
            target/debian/skwir*.deb
            target/generate-rpm/skwir*.rpm
            target/aur/skwir*.pkg.tar.zst
            !target/aur/*-debug-*
          if-no-files-found: error
