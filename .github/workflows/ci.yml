name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - name: Lint
        run: nix develop --command just lint-all
      - name: Dependencies
        run: nix develop --command just deny
      - name: Test
        run: nix develop --command just test-all
      - name: The window, driven by a script
        # On an X display of its own with software Vulkan (Xvfb and Mesa
        # from the flake's nixpkgs): no GPU or display needed.
        run: nix develop --command just smoke
      - name: Native Poppler reader
        run: nix develop --command just poppler-check
      - name: Native MuPDF reader
        run: nix develop --command just mupdf-check
      - name: Performance budgets
        # Hosted runners are slower and noisier than the reference machine;
        # budgets carry a 3x margin over local measurements for that reason.
        run: nix develop --command just bench-check

  # The Linux packages (ADR-040), each built in its distribution's own
  # container and installed there, then checked (`tools/package/try.sh`
  # does the same from any Linux, installing into a fresh root). Written
  # in Phase 5a, never run (no remote).
  linux-packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: debian
            image: debian:13
          - distribution: fedora
            image: fedora:44
          - distribution: arch
            image: archlinux:latest
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: What the build needs
        run: |
          tools/package/linux/prepare.sh ${{ matrix.distribution }}
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Package
        run: |
          case ${{ matrix.distribution }} in
          debian) tools/package/deb.sh ;;
          fedora) tools/package/rpm.sh ;;
          arch) chown -R builder . && su builder -c tools/package/aur/build.sh ;;
          esac
      - name: Installed and checked
        run: |
          case ${{ matrix.distribution }} in
          debian) apt-get install -y --no-install-recommends ./target/debian/bibli_*.deb ;;
          fedora) dnf -y install --setopt=install_weak_deps=False target/generate-rpm/bibli-*.rpm ;;
          arch) pacman -U --noconfirm target/aur/bibli-[0-9]*.pkg.tar.zst ;;
          esac
          tools/package/linux/check.sh
      - uses: actions/upload-artifact@v4
        with:
          name: bibli-${{ matrix.distribution }}
          path: |
            target/debian/bibli_*.deb
            target/generate-rpm/bibli-*.rpm
            target/aur/bibli-*.pkg.tar.zst
          if-no-files-found: error

  # The other systems, natively (ADR-035): written in Phase 5a, not yet run
  # (no remote). Their failures are 5b's findings: they do not block
  # merging until 5b says they pass, so `continue-on-error` until then.
  # The default members only: the native workers' libraries per system are
  # step K's, not set up here. Windows builds with the runner's MSVC; which
  # Windows toolchain ships is 5b's decision.
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        # nextest's XDG isolation (`tools/test/isolate-xdg.sh`) is a shell
        # script: Git's sh runs it on Windows.
        run: cargo nextest run --no-tests=pass
