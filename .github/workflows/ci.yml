name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - name: Lint
        run: nix develop --command just lint
      - name: Test
        run: nix develop --command just test
      - name: Performance budgets
        # Hosted runners are slower and noisier than the reference machine;
        # budgets carry a 3x margin over local measurements for that reason.
        run: nix develop --command just bench-check
