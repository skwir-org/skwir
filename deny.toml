# What `cargo deny check` holds the dependencies to (`just deny`, run by
# CI): licences skwir can ship under its own, no crate with a known
# vulnerability or withdrawn, and crates from crates.io alone.

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-gnu",
    "aarch64-apple-darwin",
]

[advisories]
version = 2
# A crate no longer maintained counts where skwir's own crates name it:
# one that comes only with a dependency (ttf-parser, with the text of gpui
# and resvg) is that dependency's to replace.
unmaintained = "workspace"
yanked = "deny"
# An advisory ignored is listed here with its reason (none now: zip 8.6's,
# held by calamine 0.36, went with calamine 0.37's zip 9 on 2026-10-28).
ignore = []

[licenses]
version = 2
# The same as tools/package/about.toml accepts for the notices.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    "MPL-2.0",
    "0BSD",
    "MIT-0",
]
confidence-threshold = 0.9

# MuPDF's helper alone links MuPDF, and is a package of its own under the
# AGPL (ADR-014).
[[licenses.exceptions]]
crate = "mupdf"
allow = ["AGPL-3.0"]

[[licenses.exceptions]]
crate = "mupdf-sys"
allow = ["AGPL-3.0"]

[bans]
# Two versions of one crate cost build time and size, not correctness.
multiple-versions = "allow"
# No dependency on crates.io taken at any version (`*`); the workspace's
# own, joined by path, are unpublished (`publish = false`).
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Zed pins these at commits: in vendor/zed/Cargo.toml (wgpu for fixes not yet
# released, its own forks for the rest) and, for the crates gpui reaches, in
# its root manifest's patches, which Skwir's repeats. Skwir takes gpui with
# Zed's pins rather than rewritten ones (ADR-064). No other git source: one
# more is a decision, named here. (Zed's scap and wasm_thread are in the lock
# file but in no build checked: screen capture is off, and no target is wasm.)
allow-git = [
    "https://github.com/gfx-rs/wgpu",
    "https://github.com/zed-industries/async-process.git",
    "https://github.com/zed-industries/async-task.git",
    "https://github.com/zed-industries/calloop",
    "https://github.com/zed-industries/font-kit",
    "https://github.com/zed-industries/khronos-egl",
    "https://github.com/zed-industries/oo7",
    "https://github.com/zed-industries/xim-rs.git",
]
required-git-spec = "rev"
