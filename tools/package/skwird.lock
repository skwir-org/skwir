# skwird as skwir's packages bring it (ADR-050, amended 2026-11-26): one
# release of skwir-org/skwird, each file's SHA-256 as the release's
# SHA256SUMS says, and its source archive's as GitHub serves it (the sum
# the AUR's skwird checks too). skwir's apt and dnf repositories list the
# .deb and .rpm; the Windows and macOS packages carry its programs; the
# Linux tarball builds it from the source. To update: a newer release's
# tag and sums here, with a skwir release. An .rpm the repositories' key
# did not sign ends with `unsigned`: Fedora's repository lists no skwird
# then (dnf checks each package), until a release of it signed is pinned.
