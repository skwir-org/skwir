# skwird as skwir's packages bring it (ADR-050, amended 2026-11-26 and
# 2026-11-27): one release of skwir-org/skwird, each file's SHA-256 as the
# release's SHA256SUMS says. skwir's apt and dnf repositories list the .deb
# and .rpm; the Windows and macOS packages and the Linux tarball carry its
# programs, its licences and its notices from its archive for that system
# (tools/package/skwird.py). To update: a newer release's tag and sums
# here, with a skwir release. An .rpm the repositories' key did not sign
# ends with `unsigned`: Fedora's repository then lists no skwird (dnf
# checks each package), until a release of it signed is pinned.
