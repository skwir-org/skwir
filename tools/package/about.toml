# What cargo-about reads the dependencies' licences with
# (tools/package/notices.py): the licences a crate may be used under, the
# first of them taken where a crate offers several, and the targets the
# packages are built for.
accepted = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "CC0-1.0", "Unlicense", "BSL-1.0", "MPL-2.0", "0BSD", "MIT-0", "CDLA-Permissive-2.0", "OFL-1.1", "Unicode-DFS-2016", "bzip2-1.0.6"]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
ignore-dev-dependencies = true
ignore-build-dependencies = true
workarounds = ["ring", "rustls", "wasmtime"]

# MuPDF's helper alone, in a package of its own under the AGPL (ADR-014).
[mupdf-sys]
accepted = ["AGPL-3.0"]

[mupdf]
accepted = ["AGPL-3.0"]
